<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FAF9F5" />
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#E5E3DC" stroke-width="2" />
  
  <!-- Subtle technical grid dots -->
  <defs>
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#D8D6CE" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dotGrid)" opacity="0.6" />

  <!-- Logo Mark -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="18" height="18" rx="2" fill="#6B4BF0" />
    <rect x="24" y="0" width="18" height="18" rx="2" fill="#0E86AD" />
    <rect x="48" y="0" width="18" height="18" rx="2" fill="#8A6BFF" />
    <rect x="0" y="24" width="18" height="18" rx="2" fill="#0E86AD" />
    <rect x="24" y="24" width="18" height="18" rx="2" fill="#A9760C" />
    <rect x="48" y="24" width="18" height="18" rx="2" fill="#6B4BF0" />
    <rect x="0" y="48" width="18" height="18" rx="2" fill="#8A6BFF" />
    <rect x="24" y="48" width="18" height="18" rx="2" fill="#6B4BF0" />
    <rect x="48" y="48" width="18" height="18" rx="2" fill="#0E86AD" />
    <text x="82" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="#14112E" letter-spacing="2">TESSERA</text>
  </g>

  <!-- Eyebrow Badge -->
  <g transform="translate(100, 200)">
    <rect width="260" height="32" rx="4" fill="#EAE8E0" />
    <text x="14" y="21" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#4B473D" letter-spacing="1.5">DATA ENVIRONMENT AUTOMATION</text>
  </g>

  <!-- Headline -->
  <text x="100" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#14112E" letter-spacing="-1">Production-like data.</text>
  <text x="100" y="375" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#14112E" letter-spacing="-1">Without production risk.</text>

  <!-- Subtitle -->
  <text x="100" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#585468" line-height="34">
    Modular sensitive-data discovery, deterministic masking, referential
  </text>
  <text x="100" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#585468">
    subsetting &amp; continuous change capture for modern engineering and AI.
  </text>

  <!-- Footer Tags -->
  <g transform="translate(100, 550)">
    <text x="0" y="0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#6B4BF0" font-weight="600">DISCOVERY [READY]  •  MASKING [READY]  •  SUBSETTER [READY]  •  CDC [HARDENING]</text>
