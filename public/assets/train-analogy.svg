<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="auto">
  <defs>
    <linearGradient id="shinkansenBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2AC9"/>
      <stop offset="100%" stop-color="#6B4BF0"/>
    </linearGradient>
    <linearGradient id="speedGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1740"/>
      <stop offset="100%" stop-color="#0E86AD"/>
    </linearGradient>
    <linearGradient id="rusticWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="50%" stop-color="#1E3F1A"/>
      <stop offset="100%" stop-color="#142B11"/>
    </linearGradient>
    <filter id="brakeSparks" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Track / Ground Rail -->
  <line x1="20" y1="200" x2="980" y2="200" stroke="#3A3654" stroke-width="4"/>
  <line x1="20" y1="206" x2="980" y2="206" stroke="#221F38" stroke-width="2"/>
  <!-- Sleepers / Ties -->
  <g stroke="#2C2846" stroke-width="3">
    <line x1="40" y1="198" x2="40" y2="208"/><line x1="80" y1="198" x2="80" y2="208"/>
    <line x1="120" y1="198" x2="120" y2="208"/><line x1="160" y1="198" x2="160" y2="208"/>
    <line x1="200" y1="198" x2="200" y2="208"/><line x1="240" y1="198" x2="240" y2="208"/>
    <line x1="280" y1="198" x2="280" y2="208"/><line x1="320" y1="198" x2="320" y2="208"/>
    <line x1="360" y1="198" x2="360" y2="208"/><line x1="400" y1="198" x2="400" y2="208"/>
    <line x1="440" y1="198" x2="440" y2="208"/><line x1="480" y1="198" x2="480" y2="208"/>
    <line x1="520" y1="198" x2="520" y2="208"/><line x1="560" y1="198" x2="560" y2="208"/>
    <line x1="600" y1="198" x2="600" y2="208"/><line x1="640" y1="198" x2="640" y2="208"/>
    <line x1="680" y1="198" x2="680" y2="208"/><line x1="720" y1="198" x2="720" y2="208"/>
    <line x1="760" y1="198" x2="760" y2="208"/><line x1="800" y1="198" x2="800" y2="208"/>
    <line x1="840" y1="198" x2="840" y2="208"/><line x1="880" y1="198" x2="880" y2="208"/>
    <line x1="920" y1="198" x2="920" y2="208"/><line x1="960" y1="198" x2="960" y2="208"/>
  </g>

  <!-- ================= CARRIAGE 4: THE BOTTLENECK (OLD STEAM WOODEN CARRIAGE ON THE LEFT) ================= -->
  <g class="bottleneck-carriage">
    <!-- Red Alert Box Framing the Problem -->
    <rect x="40" y="90" width="280" height="105" rx="6" fill="none" stroke="#FF4D4D" stroke-width="3" stroke-dasharray="6,4"/>
    
    <!-- Old Rustic Wooden Car Body -->
    <rect x="48" y="98" width="264" height="84" rx="4" fill="url(#rusticWood)" stroke="#11220F" stroke-width="2"/>
    <!-- Old arched Roof -->
    <path d="M 45 98 Q 180 85 315 98 Z" fill="#1B1715"/>
    
    <!-- Glowing Old Lantern Windows with Bars -->
    <g fill="#FFB300" stroke="#3E2723" stroke-width="2">
      <rect x="60" y="112" width="16" height="24" rx="1"/>
      <rect x="84" y="112" width="22" height="24" rx="1"/>
      <rect x="116" y="112" width="22" height="24" rx="1"/>
      <rect x="148" y="112" width="22" height="24" rx="1"/>
      <rect x="180" y="112" width="22" height="24" rx="1"/>
      <rect x="212" y="112" width="22" height="24" rx="1"/>
      <rect x="244" y="112" width="22" height="24" rx="1"/>
      <rect x="276" y="112" width="22" height="24" rx="1"/>
    </g>

    <!-- Heavy Cast Iron Wheels with Friction Brake Sparks -->
    <circle cx="90" cy="192" r="10" fill="#212121" stroke="#FF7B72" stroke-width="2"/>
    <circle cx="270" cy="192" r="10" fill="#212121" stroke="#FF7B72" stroke-width="2"/>

    <!-- Friction Sparks Under Wheels (Frenando o trem) -->
    <g filter="url(#brakeSparks)">
      <path d="M 100 196 L 110 204 M 96 198 L 102 208 M 84 198 L 76 206" stroke="#FFA726" stroke-width="2"/>
      <path d="M 280 196 L 290 204 M 276 198 L 282 208 M 264 198 L 256 206" stroke="#FFA726" stroke-width="2"/>
    </g>

    <!-- Bottleneck Warning Label -->
    <rect x="70" y="45" width="220" height="38" rx="4" fill="rgba(255, 77, 77, 0.15)" stroke="#FF4D4D" stroke-width="1.5"/>
    <text x="180" y="62" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#FF6B6B" text-anchor="middle">AUTOMAÇÃO DE DADOS</text>
    <text x="180" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#FFB4B4" text-anchor="middle">O GARGALO QUE DESACELERA TUDO</text>
    <line x1="180" y1="84" x2="180" y2="90" stroke="#FF4D4D" stroke-width="1.5"/>
  </g>

  <!-- Heavy Iron Hitch Coupling Under Strain -->
  <line x1="315" y1="155" x2="342" y2="155" stroke="#999" stroke-width="6"/>
  <circle cx="329" cy="155" r="4" fill="#FF7B72"/>

  <!-- ================= CARRIAGE 3: HIGH SPEED INFRA AUTOMATION ================= -->
  <g class="bullet-train-mid2">
    <rect x="342" y="110" width="195" height="75" rx="3" fill="url(#shinkansenBody)"/>
    <!-- Windows -->
    <rect x="354" y="125" width="30" height="18" rx="2" fill="#1B1740"/>
    <rect x="395" y="125" width="36" height="18" rx="2" fill="#1B1740"/>
    <rect x="441" y="125" width="36" height="18" rx="2" fill="#1B1740"/>
    <rect x="487" y="125" width="36" height="18" rx="2" fill="#1B1740"/>
    <!-- Stripes -->
    <line x1="342" y1="162" x2="537" y2="162" stroke="#0E86AD" stroke-width="5"/>
    <line x1="342" y1="150" x2="537" y2="150" stroke="#A9760C" stroke-width="3"/>
    <!-- Wheels -->
    <circle cx="390" cy="192" r="9" fill="#14112E" stroke="#585468" stroke-width="3"/>
    <circle cx="490" cy="192" r="9" fill="#14112E" stroke="#585468" stroke-width="3"/>
    <!-- Label -->
    <rect x="345" y="55" width="190" height="28" rx="4" fill="rgba(107, 75, 240, 0.2)" stroke="#6B4BF0" stroke-width="1"/>
    <text x="440" y="73" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8A6BFF" text-anchor="middle">AUTOMAÇÃO DE INFRA</text>
    <line x1="440" y1="84" x2="440" y2="110" stroke="#6B4BF0" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- High speed coupling -->
  <line x1="537" y1="155" x2="541" y2="155" stroke="#6B4BF0" stroke-width="4"/>

  <!-- ================= CARRIAGE 2: HIGH SPEED CODE AUTOMATION ================= -->
  <g class="bullet-train-mid1">
    <rect x="541" y="110" width="195" height="75" rx="3" fill="url(#shinkansenBody)"/>
    <!-- Windows -->
    <rect x="554" y="125" width="30" height="18" rx="2" fill="#1B1740"/>
    <rect x="594" y="125" width="36" height="18" rx="2" fill="#1B1740"/>
    <rect x="640" y="125" width="36" height="18" rx="2" fill="#1B1740"/>
    <rect x="686" y="125" width="36" height="18" rx="2" fill="#1B1740"/>
    <!-- Stripes -->
    <line x1="541" y1="162" x2="736" y2="162" stroke="#0E86AD" stroke-width="5"/>
    <line x1="541" y1="150" x2="736" y2="150" stroke="#A9760C" stroke-width="3"/>
    <!-- Wheels -->
    <circle cx="590" cy="192" r="9" fill="#14112E" stroke="#585468" stroke-width="3"/>
    <circle cx="690" cy="192" r="9" fill="#14112E" stroke="#585468" stroke-width="3"/>
    <!-- Label -->
    <rect x="545" y="55" width="190" height="28" rx="4" fill="rgba(107, 75, 240, 0.2)" stroke="#6B4BF0" stroke-width="1"/>
    <text x="640" y="73" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8A6BFF" text-anchor="middle">AUTOMAÇÃO DE CÓDIGO</text>
    <line x1="640" y1="84" x2="640" y2="110" stroke="#6B4BF0" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- High speed coupling -->
  <line x1="736" y1="155" x2="740" y2="155" stroke="#6B4BF0" stroke-width="4"/>

  <!-- ================= CARRIAGE 1: HIGH SPEED BULLET TRAIN ENGINE (MOVING TO THE RIGHT) ================= -->
  <g class="bullet-train-lead">
    <!-- Aerodynamic Locomotive Nose Pointing RIGHT (from 740 to 960) -->
    <path d="M 740 185 L 860 185 L 960 185 Q 930 120 840 110 L 740 110 Z" fill="url(#shinkansenBody)"/>
    <!-- Sleek Cockpit Windshield Facing Right -->
    <path d="M 840 125 Q 870 125 915 140 L 895 145 L 840 145 Z" fill="url(#speedGlass)"/>
    <!-- High speed racing stripes (Cyan & Gold from Tessera) -->
    <path d="M 740 162 Q 880 162 942 170" stroke="#0E86AD" stroke-width="5" fill="none"/>
    <path d="M 740 150 Q 860 150 910 156" stroke="#A9760C" stroke-width="3" fill="none"/>
    <!-- Wheels -->
    <circle cx="790" cy="192" r="9" fill="#14112E" stroke="#585468" stroke-width="3"/>
    <circle cx="900" cy="192" r="9" fill="#14112E" stroke="#585468" stroke-width="3"/>
    <!-- Label -->
    <rect x="760" y="55" width="190" height="28" rx="4" fill="rgba(107, 75, 240, 0.2)" stroke="#6B4BF0" stroke-width="1"/>
    <text x="855" y="73" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8A6BFF" text-anchor="middle">AGENTES DE IA</text>
    <line x1="855" y1="84" x2="855" y2="110" stroke="#6B4BF0" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
</svg>
