# ==============================================================================
# Configuração para Produção na VPS Hostinger (ex: tessera.com.br / tessera.data)
# ==============================================================================

server {
    listen 80;
    server_name tessera.com.br www.tessera.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tessera.com.br www.tessera.com.br;

    ssl_certificate /etc/letsencrypt/live/tessera.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tessera.com.br/privkey.pem;

    root /var/www/tessera;
    index index.html;

    # Segurança & Headers HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline';" always;

    # Gzip / Compressão
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|ico|woff2?)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
